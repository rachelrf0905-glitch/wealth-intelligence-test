<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10283f">
  <meta name="description" content="财富认知力评估：10道专业情境题，探索你的经济决策、人际协作与风险管理倾向。">
  <title>财富认知力评估 | Wealth Intelligence Assessment</title>
  <style>
    :root{--navy:#10283f;--dark:#0b1b2e;--gold:#ba9660;--goldlight:#e5cc98;--muted:#718295;--line:#dce4e9;--paper:#ffffff;--canvas:#eef2f4;--ink:#172a3a}
    *{box-sizing:border-box}
    html{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;-webkit-font-smoothing:antialiased}
    body{margin:0;color:var(--ink);background:var(--canvas);min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(20,54,80,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(20,54,80,.035) 1px,transparent 1px);background-size:40px 40px}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(186,150,96,.45);outline-offset:3px}
    button:disabled{opacity:.4;cursor:not-allowed}
    .page{position:relative;max-width:510px;min-height:100vh;margin:0 auto;background:#f9fbfc;box-shadow:0 22px 75px rgba(12,42,70,.09)}
    .mast{min-height:75px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 25px}
    .mark{display:flex;align-items:center;gap:11px;color:white}
    .mark-icon{width:29px;height:29px;display:grid;place-items:center;border:1px solid #bca16c;border-radius:50%;color:#dec18a;font-size:19px;line-height:1}
    .mark-title{font-weight:680;letter-spacing:2px;font-size:11px}
    .mark-sub{font-size:9px;letter-spacing:1.1px;color:#aebfcb;margin-top:4px}
    .mast-right{font-size:10px;letter-spacing:1.1px;color:#9eafbd;white-space:nowrap}
    .screen{min-height:640px;animation:appear .23s ease both}
    @keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .pad{padding:35px 29px 40px}
    .eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:750}
    .hero{font-size:36px;letter-spacing:-1px;line-height:1.28;font-weight:750;margin:17px 0 13px}
    .hero em{font-style:normal;color:#ac8853}
    .summary{font-size:13px;line-height:2;color:#607487;margin:0}
    .gold-rule{height:2px;background:linear-gradient(90deg,#c5a775 0 25%,#e5e8eb 25% 100%);margin:29px 0}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:23px 0 32px}
    .metric{background:white;border:1px solid var(--line);border-radius:10px;padding:15px 7px 12px;text-align:center}
    .metric strong{display:block;font-size:24px;color:var(--navy);font-weight:680}
    .metric small{font-size:10px;color:var(--muted);display:block;margin-top:6px}
    .label{font-size:10px;letter-spacing:1.8px;font-weight:720;color:#8191a0}
    .codebox{width:100%;height:52px;padding:0 16px;margin-top:11px;background:white;border:1px solid #cbd8e0;border-radius:8px;font-size:16px;letter-spacing:4px;color:var(--navy)}
    .primary{width:100%;border:0;background:var(--navy);color:#fff;min-height:50px;padding:12px 18px;border-radius:8px;font-weight:650;font-size:13px;letter-spacing:.5px;transition:background .16s}
    .primary:hover{background:#204660}
    .primary.secondary{background:#fff;color:var(--navy);border:1px solid #cbd8e0}
    .primary.secondary:hover{background:#edf3f5}
    .hint{color:#8795a4;font-size:11px;line-height:1.7;text-align:center}
    .error{min-height:20px;margin:7px 0 0;color:#aa4e4e;font-size:12px}
    .progress-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7f8e9c}
    .progress-track{height:4px;background:#e4eaed;border-radius:7px;overflow:hidden;margin:15px 0 36px}
    .progress-fill{height:100%;background:var(--gold);border-radius:7px;transition:width .25s}
    .q-type{font-size:11px;color:#a5804b;font-weight:680;letter-spacing:1.2px}
    .question-title{font-size:20px;line-height:1.7;font-weight:690;letter-spacing:-.2px;margin:15px 0 28px}
    .options{display:grid;gap:11px}
    .option{width:100%;border:1px solid #d7e1e6;background:#fff;border-radius:9px;display:flex;align-items:flex-start;gap:13px;text-align:left;padding:15px 14px;line-height:1.75;font-size:13px;color:#2d3f4f;transition:border-color .18s,background .18s}
    .option:hover{border-color:#92a9b7}
    .option[aria-pressed="true"]{border-color:#2c617b;background:#eef5f7;box-shadow:0 0 0 1px #2c617b inset}
    .letter{width:23px;height:23px;flex-shrink:0;border:1px solid #d7e1e6;border-radius:5px;display:grid;place-items:center;font-size:11px;color:#8794a1;font-weight:750;margin-top:1px}
    .option[aria-pressed="true"] .letter{background:#204660;border-color:#204660;color:#fff}
    .navrow{display:grid;grid-template-columns:125px 1fr;gap:11px;margin-top:30px}
    .navrow button{min-height:49px}
    .result-page{padding:25px 22px 15px;background:#fff}
    .report-ref{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:9px;letter-spacing:1.2px;color:#8494a2;font-weight:700}
    .result-hero{background:linear-gradient(145deg,#10283f,#173d56);color:white;border-radius:12px;padding:25px 23px 24px;margin:19px 0 26px;position:relative;overflow:hidden}
    .result-hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(229,204,152,.2);border-radius:50%;top:-112px;right:-108px;box-shadow:0 0 0 34px rgba(229,204,152,.055),0 0 0 71px rgba(229,204,152,.045)}
    .result-mini{font-size:10px;color:#d9bb83;letter-spacing:1.8px;font-weight:700;position:relative}
    .result-score{font-size:59px;font-weight:700;letter-spacing:-2px;line-height:1;margin:20px 0 12px;position:relative}
    .result-score span{font-size:15px;color:#abbfcd;letter-spacing:0;font-weight:400}
    .result-divider{height:1px;background:rgba(226,235,241,.19);margin:16px 0}
    .result-level{color:#e3c38c;font-size:17px;font-weight:660}
    .result-persona{font-size:12px;color:#d1dfeb;margin-top:11px}
    .result-hero p{font-size:12px;line-height:1.9;color:#c6d3de;margin:14px 0 0}
    .section-head{display:flex;align-items:center;gap:9px;margin:25px 0 13px;font-size:10px;color:#9c7b4d;letter-spacing:1.2px;font-weight:720}
    .section-head:after{content:"";flex:1;height:1px;background:#e2e8ec}
    .report-title{font-size:18px;font-weight:730;line-height:1.6;margin:0 0 10px}
    .report-copy{font-size:12px;line-height:2;color:#667788;margin:0}
    .bar-row{margin:13px 0}
    .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
    .bar-label strong{color:#a78652;font-weight:700}
    .bar-bg{height:6px;background:#edf1f4;border-radius:8px;overflow:hidden}
    .bar-bg div{height:100%;background:linear-gradient(90deg,#527b8d,#b79664);border-radius:8px}
    .insight{background:#f5f8fa;border-left:2px solid #b8955e;border-radius:0 8px 8px 0;padding:14px 14px;margin:13px 0 3px}
    .insight strong{font-size:12px}
    .fineprint{font-size:10px;color:#92a0ac;line-height:1.8;margin:23px 0 10px;border-top:1px solid #e7ecef;padding-top:13px}
    .report-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f9fbfc;padding:17px 22px 27px;border-top:1px solid #e7edf0}
    .report-actions .primary{font-size:12px;padding:10px 7px}
    .footer{padding:15px 20px 22px;text-align:center;font-size:10px;color:#9aabb7}
    @media(min-width:550px){.page{margin:26px auto;min-height:calc(100vh - 52px);border-radius:13px;overflow:hidden}}
    @media(max-width:355px){.pad{padding:28px 19px}.hero{font-size:32px}.mast{padding:16px}.question-title{font-size:18px}.navrow{grid-template-columns:105px 1fr}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>

<script>
'use strict';
(()=>{

      ['立即调整岗位或解除合作，形成震慑',3],

    {d:0,tag:'财务分析 / CAPITAL ALLOCATION',q:'你有一笔业务扩张预算，但未来半年收入不确定。以下安排哪个最接近你的做法？',options:[

      ['暂时冻结投资，等收入完全稳定',3],
      ['按各部门申请金额同比例分配',1],

      ['独立评估未来现金流与替代选择，不因过去投入影响判断',4],
      ['坚持原计划，避免此前投入无法收回',1],
      ['要求团队再努力一个季度后再决定',2],
      ['暂停新增投入，快速补齐关键验证数据',3]]},
    {d:2,tag:'商业洞察 / MARKET SHIFT',q:'某项新技术可能在三年内替代你的主力业务，目前老业务仍有稳定利润。你会？',options:[
      ['立即放弃老业务，全面投入新技术',2],
      ['维持现金流，同时设置小规模实验验证新业务的增长路径',4],
      ['暂时不变，等技术真正成熟后再行动',1],
      ['加大老业务的促销和渠道投入，延长生命周期',3]]},
    {d:3,tag:'合作谈判 / COMMERCIAL CREDIT',q:'重要客户提出延长付款周期，以换取订单增长40%。你如何协商？',options:[
      ['接受新账期，大客户订单增长更重要',1],
      ['拒绝赊销，所有客户必须现款结算',2],
      ['先提供短期试点，暂不改变整体信用政策',3],
      ['测算毛利、资金占用和违约概率，设计额度及担保条件',4]]},
    {d:4,tag:'组织领导 / EQUITY GOVERNANCE',q:'你与朋友共同创业：一方主要出资，另一方全职经营。关于股权，你会？',options:[
      ['将出资、劳动、控制权和退出机制拆开设计并书面约定',4],
      ['先各占一半，维护双方关系',2],
      ['按出资金额决定所有股权比例',3],
      ['先经营起来，盈利后再解决分配问题',1]]}
  ];
  const DIMS=['财务分析','风险治理','商业洞察','合作谈判','组织领导'];
  const DESCS=[
    {strength:'你注重经营数字背后的现金流质量，而非只看表面的收入增长。',weak:'在涉及资金安排时，建议结合现金流预测、应收回款与资金安全边际进行复盘。',action:'建立一页纸现金流看板，追踪现金余额、回款周期和未来三个月资金缺口。'},
    {strength:'你善于在决策前识别下行风险，愿意修正不再成立的判断。',weak:'遇到高收益、熟人项目或沉没成本时，应进一步明确风险边界和退出规则。',action:'为下一项重大决策写下最大可接受损失、关键假设及退出触发条件。'},
    {strength:'你倾向通过客户需求、商业模式和单位经济性判断机会的真实价值。',weak:'面对价格竞争或技术变化时，可加强客户分层和低成本实验，减少凭直觉行动。',action:'选择一个市场变化，完成10位客户访谈并验证一项能够付费的需求。'},
    {strength:'你善于把合作冲突转化为可衡量的贡献、责任和长期激励机制。',weak:'在利益冲突中，应避免只追求短期和气，明确可执行的交易条件。',action:'整理一份合作协议检查清单，覆盖收益分配、履约、违约和退出安排。'},
    {strength:'你能够兼顾个人贡献与组织整体效率，关注规则与长期协同。',weak:'对于高绩效个体或熟人合作，可进一步区分个人关系与组织治理。',action:'制定关键岗位职责、行为底线和两周一次的协作复盘机制。'}
  ];
  const LEVELS=[
    {id:'L1',name:'安全筑基者',desc:'你倾向于关注当下安全与稳定，下一步值得强化系统化决策和财务边界。'},
    {id:'L2',name:'稳健积累者',desc:'你具备一定的风险意识，进一步提升信息分析和资源协调能力会更有帮助。'},
    {id:'L3',name:'机会探索者',desc:'你已经展现出部分商业判断能力，仍需要让经济分析与协作规则更加稳定。'},

  ];
  let index=0,unlocked=false,answers=Array(QUESTIONS.length).fill(-1),result=null;
  function htmlEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function codeHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  const PASS_HASH=1839134208;
  function renderHome(){result=null;app.innerHTML=`<div class="pad"><div class="eyebrow">PRIVATE ASSESSMENT · 2026</div><h1 class="hero">财富认知力<br><em>专业评估</em></h1><p class="summary">一个人能够驾驭多大的财富，不只取决于赚取能力，也取决于如何处理经济问题、风险和人际利益关系。</p><div class="gold-rule"></div><div class="metrics"><div class="metric"><strong>10</strong><small>决策情境题</small></div><div class="metric"><strong>5</strong><small>认知维度</small></div><div class="metric"><strong>3–5</strong><small>分钟完成</small></div></div><div class="label">ACCESS VERIFICATION / 访问验证</div><form id="entry-form"><input class="codebox" id="entry-code" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="请输入六位访问验证码" aria-label="六位访问验证码" required><div class="error" id="entry-error" role="alert"></div><button class="primary" type="submit">验证并开始评估 →</button></form><p class="hint" style="margin-top:24px">无需填写收入或资产数据<br>所有作答仅在当前浏览器中计算，不上传服务器</p></div>`;
    document.getElementById('entry-form').addEventListener('submit',ev=>{ev.preventDefault();const value=document.getElementById('entry-code').value;if(value.length===6&&codeHash(value)===PASS_HASH){unlocked=true;index=0;answers=Array(10).fill(-1);renderQuestion();}else{document.getElementById('entry-error').textContent='验证码不正确，请重新输入';document.getElementById('entry-code').value='';}});
  }
  function renderQuestion(){if(!unlocked)return renderHome();const q=QUESTIONS[index];app.innerHTML=`<div class="pad"><div class="progress-top"><span>DECISION ASSESSMENT</span><span>${String(index+1).padStart(2,'0')} / 10</span></div><div class="progress-track"><div class="progress-fill" style="width:${(index+1)*10}%"></div></div><div class="q-type">${q.tag}</div><h2 class="question-title">${htmlEscape(q.q)}</h2><div class="options" id="opts"></div><div class="navrow"><button class="primary secondary" id="go-prev" ${index===0?'disabled':''}>← 上一题</button><button class="primary" id="go-next" ${answers[index]<0?'disabled':''}>${index===9?'生成评估报告 →':'下一题 →'}</button></div><p class="hint" style="margin-top:19px">请按你最可能采取的实际行动选择，而非理想答案</p></div>`;
    const opts=document.getElementById('opts');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.type='button';b.setAttribute('aria-pressed',answers[index]===i?'true':'false');b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${htmlEscape(o[0])}</span>`;b.addEventListener('click',()=>{answers[index]=i;renderQuestion();});opts.appendChild(b);});
    document.getElementById('go-prev').onclick=()=>{index=Math.max(0,index-1);renderQuestion()};
    document.getElementById('go-next').onclick=()=>{if(answers[index]===-1)return;if(index<9){index++;renderQuestion();}else renderResult();};
  }
  function evaluate(){const vals=QUESTIONS.map((q,i)=>q.options[answers[i]][1]);const dimRaw=DIMS.map((_,d)=>vals.reduce((s,v,i)=>s+(QUESTIONS[i].d===d?v:0),0));const dimScores=dimRaw.map(n=>Math.round((n-2)/6*100));const total=Math.round((vals.reduce((a,b)=>a+b,0)-10)/30*100);const level=total>=85?5:total>=70?4:total>=55?3:total>=40?2:total>=25?1:0;const sorted=[0,1,2,3,4].sort((a,b)=>dimScores[b]-dimScores[a]||a-b);const top=sorted[0];const low=[0,1,2,3,4].sort((a,b)=>dimScores[a]-dimScores[b]||a-b)[0];const pair=sorted.slice(0,2).sort((a,b)=>a-b).join('-');const persona={'0-1':'资本守护者','0-2':'价值经营者','0-3':'财务协调者','0-4':'系统经营者','1-2':'策略进攻者','1-3':'稳健谈判者','1-4':'稳健掌舵者','2-3':'市场猎手','2-4':'机会整合者','3-4':'关系架构师'}[pair]||'复合型决策者';return{vals,dimScores,total,level,top,low,persona,date:new Date().toLocaleDateString('zh-CN')};}
  function renderResult(){if(answers.some(v=>v<0))return renderQuestion();result=evaluate();const r=result,l=LEVELS[r.level];app.innerHTML=`<div id="capture-content" class="result-page"><div class="report-ref"><span>CONFIDENTIAL · PERSONAL REPORT</span><span>${htmlEscape(r.date)}</span></div><div class="result-hero"><div class="result-mini">WEALTH COGNITION INDEX</div><div class="result-score">${r.total}<span> / 100</span></div><div class="result-divider"></div><div class="result-level">${l.id} · ${l.name}</div><div class="result-persona">认知画像：${r.persona}</div><p>${l.desc}</p></div><div class="section-head">01 / CORE STRENGTH · 核心优势</div><h2 class="report-title">你的突出优势：${DIMS[r.top]}</h2><p class="report-copy">${DESCS[r.top].strength}</p><div class="section-head">02 / FIVE-DIMENSION INDEX · 五维图谱</div><div id="bars"></div><div class="section-head">03 / IMPROVEMENT · 提升方向</div><h2 class="report-title">值得关注：${DIMS[r.low]}</h2><p class="report-copy">${DESCS[r.low].weak}</p><div class="section-head">04 / 30-DAY ACTION · 行动建议</div><div class="insight"><strong>未来30天的一个建议</strong><p class="report-copy" style="margin-top:6px">${DESCS[r.low].action}</p></div><div class="fineprint">说明：本测试是一种探索性情境评估，不是经心理测量学验证的标准化量表，也不代表真实财富等级、实际投资能力或未来收入。结果不构成财务或投资建议。</div></div><div class="report-actions" id="report-actions"><button class="primary secondary" type="button" id="retry">↺ 再次测试</button><button class="primary" type="button" id="save">↓ 保存结果图片</button></div>`;
    const bars=document.getElementById('bars');DIMS.forEach((d,i)=>{bars.insertAdjacentHTML('beforeend',`<div class="bar-row"><div class="bar-label"><span>${d}</span><strong>${r.dimScores[i]}</strong></div><div class="bar-bg"><div style="width:${r.dimScores[i]}%"></div></div></div>`)});
    document.getElementById('retry').onclick=()=>{unlocked=true;index=0;answers=Array(10).fill(-1);result=null;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});};
    document.getElementById('save').onclick=downloadReportPNG;
    window.scrollTo({top:0,behavior:'smooth'});
  }
  // 原生 Canvas 输出报告，无需依赖外部 CDN。导出区域不包含操作按钮。
  function downloadReportPNG(){if(!result)return;const r=result,l=LEVELS[r.level],scale=2,W=540,H=1270;const canvas=document.createElement('canvas');canvas.width=W*scale;canvas.height=H*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#f9fbfc';ctx.fillRect(0,0,W,H);
    const font=(size,weight=400)=>`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif`;
    function text(s,x,y,size,color,weight=400){ctx.fillStyle=color;ctx.font=font(size,weight);ctx.fillText(s,x,y)}
    function round(x,y,w,h,rad,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,rad);ctx.fillStyle=fill;ctx.fill()}
    function wrapped(s,x,y,maxW,size,color,lineH=24,weight=400){ctx.font=font(size,weight);ctx.fillStyle=color;let ln='',cy=y;for(const c of s){if(ctx.measureText(ln+c).width>maxW&&ln){ctx.fillText(ln,x,cy);ln=c;cy+=lineH;}else ln+=c;}if(ln)ctx.fillText(ln,x,cy);return cy+lineH;}
    function rule(y,title){text(title,34,y,12,'#ad8750',700);ctx.fillStyle='#d9e1e5';ctx.fillRect(34,y+12,472,1)}
    round(0,0,W,72,0,'#10283f');text('◇  WEALTH INTELLIGENCE',30,44,15,'#e7d09b',700);text('PRIVATE REPORT',410,44,10,'#a7bac6');
    text('CONFIDENTIAL  ·  PERSONAL ASSESSMENT',34,106,10,'#758596',700);text(r.date,435,106,11,'#758596');
    round(27,125,486,240,13,'#112d45');text('WEALTH COGNITION INDEX',50,160,12,'#e3c38c',700);text(String(r.total),48,243,70,'#ffffff',700);text('/ 100',150,241,18,'#b3c4d1');ctx.fillStyle='#476177';ctx.fillRect(50,263,438,1);text(`${l.id} · ${l.name}`,50,298,24,'#e5c991',700);text(`认知画像：${r.persona}`,50,328,14,'#d6e0e9');
    rule(403,'01   /   CORE STRENGTH · 核心优势');text('你的突出优势：'+DIMS[r.top],34,454,23,'#193044',700);wrapped(DESCS[r.top].strength,34,486,465,15,'#657889',26);
    rule(554,'02   /   FIVE-DIMENSION INDEX · 五维图谱');
    let y=593;DIMS.forEach((d,i)=>{text(d,34,y,15,'#253c4e');text(String(r.dimScores[i]),470,y,15,'#ab8953',700);round(34,y+12,472,7,4,'#e4ebee');if(r.dimScores[i]>0)round(34,y+12,472*r.dimScores[i]/100,7,4,'#8d9eaa');y+=52});
    rule(878,'03   /   IMPROVEMENT · 提升方向');text('值得关注：'+DIMS[r.low],34,929,22,'#193044',700);wrapped(DESCS[r.low].weak,34,960,470,15,'#657889',26);
    rule(1035,'04   /   30-DAY ACTION · 30天行动');round(27,1056,486,88,9,'#edf2f4');wrapped(DESCS[r.low].action,44,1087,454,15,'#3b5365',25);
    ctx.fillStyle='#dae2e6';ctx.fillRect(34,1181,472,1);wrapped('说明：此测试仅用于自我探索，不是标准化心理测量，不代表实际财富水平，也不构成财务建议。',34,1211,472,11,'#81909e',19);
    try{const a=document.createElement('a');a.download='财富认知力评估报告.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}catch(e){alert('图片保存失败，请尝试使用最新版浏览器。')}
  }
  renderHome();
})();
